<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title description">
  <title id="title">An autoencoder compresses and reconstructs an image</title>
  <desc id="description">From left to right: an input image x with d values, a narrowing encoder, a latent code z with k values where k is much smaller than d, a widening decoder, and a reconstruction x hat with d values. The reconstruction loss compares the input and output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <pattern id="image-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 H 0 V 20" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="260" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">
    <g font-size="17" font-weight="600">
      <text x="75" y="35">Input</text>
      <text x="230" y="35">Encoder</text>
      <text x="400" y="35">Latent code</text>
      <text x="570" y="35">Decoder</text>
      <text x="725" y="35">Reconstruction</text>
    </g>
    <rect x="25" y="70" width="100" height="100" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="25" y="70" width="100" height="100" rx="5" fill="url(#image-grid)"/>
    <rect x="56" y="101" width="38" height="38" rx="4" fill="#f1f5f9"/>
    <text x="75" y="128" font-size="25" font-style="italic">x</text>
    <path d="M 175 65 L 285 95 V 145 L 175 175 Z" fill="#e9f2fb" stroke="#377eb8" stroke-width="2"/>
    <text x="224" y="127" font-size="23" fill="#2563a6">μ<tspan baseline-shift="sub" font-size="15">ϕ</tspan></text>
    <rect x="350" y="95" width="100" height="50" rx="6" fill="#fff2dd" stroke="#cc862b" stroke-width="2"/>
    <text x="400" y="128" font-size="25" font-style="italic" fill="#995c12">z</text>
    <path d="M 515 95 L 625 65 V 175 L 515 145 Z" fill="#e9f2fb" stroke="#377eb8" stroke-width="2"/>
    <text x="577" y="127" font-size="23" fill="#2563a6">μ<tspan baseline-shift="sub" font-size="15">θ</tspan></text>
    <rect x="675" y="70" width="100" height="100" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="675" y="70" width="100" height="100" rx="5" fill="url(#image-grid)"/>
    <rect x="706" y="101" width="38" height="38" rx="4" fill="#f1f5f9"/>
    <text x="725" y="128" font-size="25" font-style="italic">x̂</text>
    <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M 132 120 H 167"/>
      <path d="M 292 120 H 342"/>
      <path d="M 458 120 H 507"/>
      <path d="M 633 120 H 667"/>
    </g>
    <g font-size="15" fill="#64748b">
      <text x="75" y="195">d values</text>
      <text x="400" y="174">k values, k ≪ d</text>
      <text x="725" y="195">d values</text>
    </g>
    <path d="M 75 209 V 233 H 725 V 209" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="235" y="219" width="330" height="27" fill="#fff"/>
    <text x="400" y="239" font-size="16" fill="#475569">Compare x and x̂: reconstruction loss</text>
  </g>
</svg>
