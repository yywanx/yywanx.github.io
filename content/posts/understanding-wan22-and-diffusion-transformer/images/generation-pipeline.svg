<text x="400" y="409" font-size="18" fill="#1e293b" font-weight="400">Two calls, same weights</text>
<text x="400" y="433" font-size="18" fill="#1e293b" font-weight="400">One call per prompt</text>
<rect x="25" y="365" width="165" height="80" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="107.5" y="393" font-size="20" fill="#1e293b" font-weight="600">Timestep t</text>
