<path d="M190 405H230" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M200 285V325H315V355" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
