<text x="400" y="64" font-size="18" fill="#64748b" font-weight="400">One video: 121 frames · height 704 · width 1280</text>
<rect x="30" y="95" width="340" height="65" rx="9" fill="#edf7f0" stroke="#56856b" stroke-width="1.5"/>
<text x="200" y="123" font-size="20" fill="#1e293b" font-weight="600">Prompt + negative prompt</text>
<rect x="430" y="95" width="340" height="65" rx="9" fill="#fff2dd" stroke="#cc862b" stroke-width="1.5"/>
<text x="600" y="123" font-size="20" fill="#1e293b" font-weight="600">Gaussian noise</text>
<rect x="30" y="195" width="340" height="90" rx="9" fill="#edf7f0" stroke="#56856b" stroke-width="1.5"/>
<text x="200" y="223" font-size="20" fill="#1e293b" font-weight="600">UMT5 text encoder</text>
<text x="200" y="249" font-size="18" fill="#1e293b" font-weight="400">Per prompt: [L, 4096]</text>
<rect x="430" y="195" width="340" height="90" rx="9" fill="#fff2dd" stroke="#cc862b" stroke-width="1.5"/>
<text x="600" y="223" font-size="20" fill="#1e293b" font-weight="600">Current latent x</text>
<text x="600" y="249" font-size="18" fill="#1e293b" font-weight="400">[48, 31, 44, 80]</text>
<path d="M200 160V195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M600 160V195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
