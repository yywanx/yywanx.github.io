<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
<title id="title">Wan2.2 text-to-video generation</title><desc id="desc">The prompt and negative prompt are encoded separately and passed to the same DiT in two calls. Its latent-shaped predictions are combined by classifier-free guidance; the solver updates the current latent repeatedly. Decode only after the final step.</desc>
