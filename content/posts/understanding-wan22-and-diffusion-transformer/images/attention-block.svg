<text x="385" y="283" font-size="20" fill="#1e293b" font-weight="600">Video self-attention</text>
<text x="385" y="309" font-size="18" fill="#1e293b" font-weight="400">Q, K: 3D RoPE · V: video</text>
<path d="M385 220V255" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250" y="390" width="270" height="60" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="385" y="418" font-size="20" fill="#1e293b" font-weight="600">Gate × output + x</text>
<path d="M385 345V390" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M385 132H165V420H250" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
