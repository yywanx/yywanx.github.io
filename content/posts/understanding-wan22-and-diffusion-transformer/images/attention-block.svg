<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080" role="img" aria-labelledby="title desc">
<title id="title">Inside WanAttentionBlock</title><desc id="desc">The input sequence passes through timestep-modulated normalization, self-attention with 3D RoPE, gated residual addition, normalized text cross-attention and residual addition, then modulated normalization and a feed-forward network with gated residual addition.</desc>
