<g font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="400" y="35" font-size="25" fill="#1e293b" font-weight="600">WanAttentionBlock</text>
<text x="400" y="65" font-size="18" fill="#64748b" font-weight="400">Video sequence stays [B, N, D] at each residual addition</text>
<text x="385" y="108" font-size="20" fill="#1e293b" font-weight="600">Input x: [B, N, D]</text>
<rect x="190" y="155" width="390" height="65" rx="9" fill="#fff2dd" stroke="#cc862b" stroke-width="1.5"/>
<text x="385" y="183" font-size="20" fill="#1e293b" font-weight="600">LayerNorm + shift / scale</text>
