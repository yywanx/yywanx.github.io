<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
<title id="title">Teacher-forcing attention mask</title><desc id="desc">A sequence of four clean chunks followed by four noisy chunks. Clean chunks attend causally to clean chunks. Each noisy chunk attends to the clean chunks before it and to itself, but not to other noisy chunks.</desc>
