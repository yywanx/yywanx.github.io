<title id="title">Bidirectional and chunk-causal attention</title><desc id="desc">Two 4-by-4 grids of chunks. Rows are queries and columns are keys. In the bidirectional mask every cell is allowed. In the chunk-causal mask a chunk can attend to itself and earlier chunks only, giving a lower-triangular block pattern.</desc>
