<text x="400" y="470" font-size="18" fill="#64748b" font-weight="400">In the causal mask, a chunk never looks at the future, so</text>
<text x="400" y="496" font-size="18" fill="#64748b" font-weight="400">once generated its keys and values never change.</text>
