<svg xmlns="http://www.w3.org/2000/svg" width="800" height="638" viewBox="0 0 800 638" role="img" aria-labelledby="title desc">
<title id="title">Rolling KV cache with an attention sink</title><desc id="desc">Each row shows which earlier chunks the model attends to while generating chunk k. The first chunk is always kept as a sink, the two most recent chunks stay in the window, and older chunks are evicted.</desc>
