<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080" role="img" aria-labelledby="title desc">
<title id="title">LongLive chunk-by-chunk generation loop</title><desc id="desc">For each chunk, noise is denoised in four steps by the causal DiT, which reads earlier chunks from a KV cache. The clean chunk is passed through the DiT once more at timestep zero to write clean keys and values into the cache, then decoded to RGB frames while the next chunk starts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="800" height="1080" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="400" y="35" font-size="25" fill="#1e293b" font-weight="600">LongLive 2.0 · chunk-by-chunk generation</text>
<text x="400" y="64" font-size="18" fill="#64748b" font-weight="400">One chunk: 8 latent frames · 7,040 tokens · about 32 RGB frames</text>
<rect x="30" y="95" width="340" height="90" rx="9" fill="#edf7f0" stroke="#56856b" stroke-width="1.5"/>
<text x="200.0" y="134.0" font-size="20" fill="#1e293b" font-weight="600">Prompt for chunk k</text>
<text x="200.0" y="160.0" font-size="18" fill="#1e293b" font-weight="400">Text: [512, 4096]</text>
<rect x="430" y="95" width="340" height="90" rx="9" fill="#fff2dd" stroke="#cc862b" stroke-width="1.5"/>
<text x="600.0" y="134.0" font-size="20" fill="#1e293b" font-weight="600">Noise for chunk k</text>
<text x="600.0" y="160.0" font-size="18" fill="#1e293b" font-weight="400">[8, 48, 44, 80]</text>
<rect x="230" y="245" width="340" height="110" rx="9" fill="#e9f2fb" stroke="#377eb8" stroke-width="1.5"/>
<text x="400.0" y="281.0" font-size="20" fill="#1e293b" font-weight="600">Causal DiT</text>
<text x="400.0" y="307.0" font-size="18" fill="#1e293b" font-weight="400">Queries: 7,040 new tokens</text>
<text x="400.0" y="333.0" font-size="18" fill="#1e293b" font-weight="400">Keys: cache + new tokens</text>
<path d="M200 185V215H330V245" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M600 185V215H470V245" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600" y="255" width="180" height="90" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="690.0" y="294.0" font-size="20" fill="#1e293b" font-weight="600">KV cache</text>
<text x="690.0" y="320.0" font-size="18" fill="#1e293b" font-weight="400">≤ 32 latent frames</text>
<path d="M600 300H570" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230" y="410" width="340" height="85" rx="9" fill="#fff2dd" stroke="#cc862b" stroke-width="1.5"/>
<text x="400.0" y="446.5" font-size="20" fill="#1e293b" font-weight="600">Solver update</text>
<text x="400.0" y="472.5" font-size="18" fill="#1e293b" font-weight="400">Chunk latent: [8, 48, 44, 80]</text>
<path d="M400 355V410" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M230 452H195V300H230" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="105" y="372" font-size="18" fill="#64748b" font-weight="400">4 denoising</text>
<text x="105" y="396" font-size="18" fill="#64748b" font-weight="400">steps</text>
<rect x="230" y="560" width="340" height="65" rx="9" fill="#fff2dd" stroke="#cc862b" stroke-width="1.5"/>
<text x="400.0" y="599.5" font-size="20" fill="#1e293b" font-weight="600">Clean chunk k</text>
<path d="M400 495V560" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230" y="690" width="340" height="90" rx="9" fill="#e9f2fb" stroke="#377eb8" stroke-width="1.5"/>
<text x="400.0" y="729.0" font-size="20" fill="#1e293b" font-weight="600">Recache: DiT at t = 0</text>
<text x="400.0" y="755.0" font-size="18" fill="#1e293b" font-weight="400">Writes clean K, V</text>
<path d="M400 625V690" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M570 735H690V345" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="735" y="560" font-size="17" fill="#64748b" font-weight="400">update</text>
<text x="735" y="583" font-size="17" fill="#64748b" font-weight="400">cache</text>
<rect x="30" y="845" width="340" height="90" rx="9" fill="#edf7f0" stroke="#56856b" stroke-width="1.5"/>
<text x="200.0" y="884.0" font-size="20" fill="#1e293b" font-weight="600">Streaming VAE decode</text>
<text x="200.0" y="910.0" font-size="18" fill="#1e293b" font-weight="400">RGB: [3, ~32, 704, 1280]</text>
<path d="M400 625V655H200V845" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430" y="845" width="340" height="90" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="600.0" y="884.0" font-size="20" fill="#1e293b" font-weight="600">Next chunk k + 1</text>
<text x="600.0" y="910.0" font-size="18" fill="#1e293b" font-weight="400">Reuses the updated cache</text>
<path d="M400 780V812H600V845" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400" y="990" font-size="18" fill="#64748b" font-weight="400">Frames of chunk k can be shown while chunk k + 1</text>
<text x="400" y="1016" font-size="18" fill="#64748b" font-weight="400">is being generated. Memory and per-chunk cost stay</text>
<text x="400" y="1042" font-size="18" fill="#64748b" font-weight="400">constant, however long the video becomes.</text>
</g></svg>
